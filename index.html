<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Дары Гекаты | Мастерская Магии</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/@max-bridge/sdk@latest/dist/index.umd.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="logo">
                <img src="logo.png" alt="Дары Гекаты" class="logo-image">
            </div>
        </header>

        <nav class="categories" id="categoriesNav">
            <button class="category-btn active" data-category="all">Все изделия</button>
            <button class="category-btn" data-category="oils">Магические масла</button>
            <button class="category-btn" data-category="ritual_candles">Обрядовые свечи</button>
            <button class="category-btn" data-category="program_candles">Программные свечи</button>
            <button class="category-btn" data-category="witch_bath">Ведьмина ванна</button>
            <button class="category-btn" data-category="amulets">Обереги и амулеты</button>
            <button class="category-btn" data-category="limited">Ограниченные коллекции</button>
            <button class="category-btn" data-category="altars">Алтари, шкатулки, монетницы</button>
        </nav>

        <main class="products-grid" id="productsGrid"></main>

        <!-- Модальное окно товара -->
        <div class="product-modal" id="productModal">
            <div class="product-modal-content">
                <button class="close-btn" id="closeProduct">×</button>
                <div class="product-image" id="productImage"></div>
                <h2 id="productName"></h2>
                <p class="product-description" id="productDescription"></p>
                <div class="product-price" id="productPrice"></div>
                <!-- Кнопка заказа ведёт сразу в чат поддержки -->
                <button class="order-btn" id="orderBtn">💬 Заказать у мастера</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
